name: Voetbal bijwerken
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/voetbal-ophalen.js
      - name: Bewaren
        run: |
          git config user.name "voetbal-bot"
          git config user.email "voetbal-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Voetbalgegevens bijgewerkt" && git push)
