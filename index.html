<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0A1A3F">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mijn app</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1A3F;--card:#11275A;--card2:#0F2250;--ink:#EAF0FF;--mut:#B8C7EE;--mut2:#9FB2DE;--acc:#3FA0FF;--line:#223F80;--btn:#3A5BA8}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 16px 40px;font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding-top:12px}h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}h2{font-size:18px;margin:20px 0 8px}h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#04122E;font-weight:700;min-height:44px;cursor:pointer}
button.ghost{background:transparent;color:#7DD3FC;border:0;padding:0 4px;font-weight:600}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--btn);background:var(--card2);color:var(--ink);margin:6px 0}
.tile{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:10px;padding:14px 16px;border-radius:16px;font-weight:700}
.tile small{display:block;color:var(--mut);font-weight:400}.mut{color:var(--mut);font-size:15px;margin:0 0 12px}.mut2{font-size:14px;color:var(--mut);margin:10px 0}.mut2 b{color:var(--ink)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.row2{display:flex;align-items:center;gap:8px}
.err{color:#fca5a5;min-height:20px}.ok{display:inline-block;padding:6px 12px;border-radius:99px;background:#0F3D2E;color:#6EE7B7;font-size:13px;font-weight:600;margin-bottom:12px}
.tabs{display:inline-flex;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}.tabs button{background:transparent;color:#C7D4F5;font-weight:500;border-radius:9px;padding:9px 16px}.tabs button.on{background:var(--acc);color:#04122E;font-weight:700}
.nav{background:transparent;color:var(--ink);border:1px solid var(--btn);min-width:44px;font-size:18px}.nav.w{font-size:14px;font-weight:600;padding:0 16px}.big{min-width:150px;text-align:center;font-size:22px;font-weight:800;text-transform:capitalize}
.leg{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;align-items:center;margin:14px 0 4px}.sq{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-3px;margin-right:6px}
.vb{padding:1px 6px;border-radius:6px;background:#fff;color:#0A1A3F;font-size:12px;font-weight:800}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dw{text-align:center;font-size:12px;font-weight:700;color:var(--mut2)}.e{visibility:hidden}
.day{position:relative;width:100%;min-height:72px;text-align:left;border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;overflow:hidden;min-width:0;border:3px solid transparent;font-weight:400}
.day.tod{border-color:#fff;box-shadow:0 0 0 3px var(--acc);z-index:1}.day .n{font-size:13px;font-weight:600;opacity:.85}.day .n.tn{font-size:11px;font-weight:800;background:var(--acc);color:#04122E;border-radius:6px;padding:1px 5px;opacity:1}
.day .sh{font-size:13px;font-weight:700}.day .sub{font-size:11px;opacity:.85}.xb{font-size:11px;font-weight:800;background:#04122E;color:#FCD34D;border-radius:5px;padding:0 5px}
.day u,.y u{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:99px}.day b{position:absolute;left:0;right:0;bottom:0;height:8px;background:#FB923C}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.li{display:flex;gap:10px;align-items:center;font-size:14px;color:#D5E0FA;margin:6px 0}.li i{width:8px;height:8px;border-radius:99px;flex:0 0 8px}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.ym{background:var(--card2);color:var(--ink);border:1px solid var(--line);padding:10px;text-align:left;border-radius:14px;font-weight:400}.mt{font-weight:800;text-transform:capitalize;display:block;margin-bottom:6px}
.yg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.yg i{font-style:normal;position:relative;overflow:hidden;font-size:11px;font-weight:600;border-radius:5px;min-height:28px;padding:2px 3px;border:2px solid transparent}.yg i.e{visibility:hidden}.y.td{border-color:#fff;box-shadow:0 0 0 2px var(--acc);z-index:1}.y u{top:3px;right:3px;width:5px;height:5px}.y b{position:absolute;left:0;right:0;bottom:0;height:4px;background:#FB923C}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--line)}.pill.Kan,.pill.thuis{background:#0f3d2e;color:#6ee7b7}.pill.Krap{background:#3a2f0b;color:#fcd34d}.pill.Botst{background:#4a1d1d;color:#fca5a5}.pill.uit{background:#1b3573;color:#c7d4f5}
@media(max-width:480px){.card{padding:10px}.mg{gap:3px}.day{padding:4px 3px;border-width:2px;min-height:64px}.day .vb{font-size:9px;padding:1px 2px;letter-spacing:-.02em}.day .sh{font-size:12px}.day .sub{font-size:10px}.xb{font-size:10px;padding:0 3px}.day .n{font-size:12px}.big{min-width:0;font-size:19px}}
@media(max-width:480px){.day{padding:4px 3px;min-height:64px}.day .n{font-size:12px}.day .sh{font-size:12px}.day .vb{font-size:10px;padding:1px 3px;letter-spacing:-.02em}.day .sub{font-size:10px}.mg{gap:3px}.xb{font-size:10px;padding:0 3px}}
.day .vb{background:transparent!important;color:#0A1A3F!important;padding:0!important;font-size:12px!important;font-weight:800;letter-spacing:0!important;display:block;line-height:1.2}
.yg i{display:flex;flex-direction:column;justify-content:space-between;min-height:40px!important}.yn{font-size:10px;line-height:1;opacity:.9}.ys{font-size:12px;font-weight:800;line-height:1;align-self:center;margin-bottom:2px}
.it{white-space:nowrap;display:inline-flex;align-items:center}
.ys.lv{font-size:8px;letter-spacing:-.03em;margin-bottom:3px;white-space:nowrap}
.huge{font-size:34px;font-weight:800;letter-spacing:-.02em}.big2{font-size:24px;font-weight:800}.pos{color:#6ee7b7}.neg{color:#fca5a5}.li2{padding:7px 0;border-top:1px solid var(--line);font-size:14px;gap:12px}.li2 span:last-child{text-align:right}
.bar{height:10px;border-radius:99px;background:#1B3573;margin:10px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}.tabs button{padding:9px 12px}
</style></head><body><main id="app"></main>
<script src="js/app.js"></script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body></html>
